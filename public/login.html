<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BookNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">📚 BookNest</div>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to continue to the bookstore</p>

    <p id="successBanner" class="success-banner" hidden>✅ Account created! Please log in.</p>
    <p id="formError" class="form-error" hidden></p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <p class="field-error" id="emailError"></p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-password" data-toggle="password" aria-label="Show password">👁</button>
        </div>
        <p class="field-error" id="passwordError"></p>
      </div>

      <button type="submit" id="submitBtn" class="auth-btn">Log In</button>
    </form>

    <p class="auth-switch">New to BookNest? <a href="register.html">Create an account</a></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
